document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#6B7079\">Activity log<\u002Fspan>\n              <span style=\"margin-left:auto;font-family:'Geist Mono',monospace;font-size:10px;color:#4E535B\">live<\u002Fspan>\n              <span style=\"width:5px;height:5px;border-radius:50%;background:#4C8B6B;animation:kl-pulse 1.2s ease-in-out infinite\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:1px\">\n              <sc-for list=\"{{ logLines }}\" as=\"l\" hint-placeholder-count=\"14\">\n                <div style=\"display:flex;gap:10px;padding:4px 0;font-family:'Geist Mono',monospace;font-size:11px;line-height:1.6\">\n                  <span style=\"color:#4E535B;flex-shrink:0\">{{ l.t }}<\u002Fspan>\n                  <span style=\"color:{{ l.c }};flex-shrink:0;width:52px\">{{ l.tag }}<\u002Fspan>\n                  <span style=\"color:#A7ACB4;min-width:0\">{{ l.msg }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:10px;padding:4px 0;font-family:'Geist Mono',monospace;font-size:11px\">\n                <span style=\"color:#4E535B\">04:12<\u002Fspan>\n                <span style=\"color:#7C93C9;width:52px\">reason<\u002Fspan>\n                <span style=\"color:#A7ACB4\">scoring 84 accounts<span style=\"display:inline-block;width:6px;height:12px;background:#7C93C9;margin-left:4px;vertical-align:-2px;animation:kl-pulse .9s steps(1) infinite\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── OUTCOME DETAIL ─────────── -->\n      <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Outcome detail\" style=\"flex:1;display:flex;flex-direction:column\">\n        <div style=\"height:52px;border-bottom:1px solid #EDE9E1;display:flex;align-items:center;padding:0 26px;gap:10px;background:#FBFAF8\">\n u002Fdiv>\n                    <div style=\"min-width:0;padding-top:0\">\n                      <div style=\"font-size:13px;line-height:1.5;color:#25282D\"><span style=\"font-weight:550\">{{ t.source }}<\u002Fspan> — {{ t.what }}<\u002Fdiv>\n                      <div style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9A948A;margin-top:4px\">{{ t.ref }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-left:1px solid #EDE9E1;background:#F9F7F4;overflow-y:auto;padding:26px 22px 50px\">\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296\">Artifacts<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:13px\">\n              <sc-for list=\"{{ artifacts }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"border:1px solid #E7E3DB;background:#fff;border-radius:9px;padding:12px 13px\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:{{ a.tagBg }};color:{{ a.tagFg }}\">{{ a.kind }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-family:'Geist Mono',monospace;font-size:10.5px;color:#A8A296\">{{ a.size }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;font-weight:500;line-height:1.4;margin-top:9px\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#8C877E;margin-top:4px\">{{ a.dest }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296;margin-top:30px\">Waiting on you<\u002Fdiv>\n            <div style=\"margin-top:13px;border:1px solid #DFE7F7;background:#FAFCFF;border-radius:9px;padding:14px\">\n              <div style=\"font-size:12.5px;line-height:1.55;color:#3A3E45\">5 save-play emails are drafted and unsent. I matched each one to how that account actually talks — Northwind's is deliberately shorter.<\u002Fdiv>\n              <button style=\"width:100%;margin-top:12px;cursor:pointer;font-family:Geist,sans-serif;border:none;background:#2159C5;color:#fff;font-size:12.5px;font-weight:550;padding:8px;border-radius:6px\">Review drafts<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296;margin-top:30px\">What I learned<\u002Fdiv>\n            <div style=\"margin-top:12px;padding:13px;border:1px dashed #DDD8CE;border-radius:9px;font-size:12.5px;line-height:1.6;color:#57534C\">\n              Week-two onboarding is now a churn signal I'll watch by default. <a href=\"#\">Undo<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── DASHBOARD ─────────── -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Outcomes dashboard\" style=\"flex:1;display:flex;flex-direction:column\">\n        <div style=\"height:52px;border-bottom:1px solid #EDE9E1;display:flex;align-items:center;padding:0 26px;gap:10px;background:#FBFAF8\">\n          <span style=\"font-size:13px;font-weight:500\">Outcomes<\u002Fspan>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#A8A296\">12 this month<\u002Fspan>\n          <div style=\"margin-left:auto;display:flex;gap:7px\">\n            <button style=\"cursor:pointer;font-family:Geist,sans-serif;font-size:12.5px;color:#5B5750;background:#fff;border:1px solid #E3DED4;padding:7px 12px;border-radius:6px\">⌕ Search<\u002Fbutton>\n            <button style=\"cursor:pointer;font-family:Geist,sans-serif;font-size:12.5px;color:#5B5750;background:#fff;border:1px solid #E3DED4;padding:7px 12px;border-radius:6px\">Filter<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goCompose }}\" style=\"cursor:pointer;font-family:Geist,sans-serif;border:none;background:#2159C5;color:#fff;font-size:12.5px;font-weight:550;padding:7px 14px;border-radius:6px\">+ New<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"overflow-y:auto;flex:1;padding:28px 32px 60px\">\n          <div style=\"display:flex;gap:1px;background:#E7E3DB;border:1px solid #E7E3DB;border-radius:11px;overflow:hidden\">\n            <sc-for list=\"{{ impact }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"flex:1;background:#fff;padding:17px 20px\">\n                <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A8A296\">{{ i.k }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:8px\">\n                  <span style=\"font-size:26px;font-weight:600;letter-spacing:-.03em\">{{ i.v }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:{{ i.deltaColor }};font-family:'Geist Mono',monospace\">{{ i.delta }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8C877E;margin-top:2px\">{{ i.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:16px;margin-top:30px;border-bottom:1px solid #EDE9E1;padding-bottom:0\">\n            <sc-for list=\"{{ dashTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"font-size:13px;font-weight:{{ t.weight }};color:{{ t.fg }};padding-bottom:9px;border-bottom:1.5px solid {{ t.underline }};cursor:pointer\">{{ t.label }} <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#A8A296\">{{ t.n }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:4px\">\n            <div style=\"display:grid;grid-template-columns:2.4fr .9fr 1fr 1.1fr .8fr;gap:16px;padding:11px 14px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#9A948A\">\n              <span>Outcome<\u002Fspan><span>Status<\u002Fspan><span>Sources<\u002Fspan><span>Result<\u002Fspan><span>Updated<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ outcomes }}\" as=\"o\" hint-placeholder-count=\"7\">\n              <div sc-camel-on-click=\"{{ goDetail }}\" style=\"display:grid;grid-template-columns:2.4fr .9fr 1fr 1.1fr .8fr;gap:16px;padding:15px 14px;align-items:center;border-top:1px solid #EFEBE3;cursor:pointer;background:{{ o.rowBg }}\" style-hover=\"background:#F6F4F0\">\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:13.5px;font-weight:500;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ o.title }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#8C877E;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ o.note }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.04em;padding:3px 8px;border-radius:5px;background:{{ o.statusBg }};color:{{ o.statusFg }}\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ o.statusFg }}\"><\u002Fspan>{{ o.status }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:4px\">\n                  <sc-for list=\"{{ o.tools }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <span style=\"width:17px;height:17px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #EAE6DE\"><span style=\"width:9px;height:9px;background-image:url({{ t.icon }});background-size:contain;background-repeat:no-repeat;background-position:center\"><\u002Fspan><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:{{ o.resultFg }};font-weight:{{ o.resultWeight }}\">{{ o.result }}<\u002Fdiv>\n                <div style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9A948A\">{{ o.when }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── INTEGRATIONS ─────────── -->\n      <sc-if value=\"{{ isInteg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Connections\" style=\"flex:1;display:flex;flex-direction:column\">\n        <div style=\"height:52px;border-bottom:1px solid #EDE9E1;display:flex;align-items:center;padding:0 26px;gap:10px;background:#FBFAF8\">\n          <span style=\"font-size:13px;font-weight:500\">Connections<\u002Fspan>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#A8A296\">11 of 14 live<\u002Fspan>\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#6B675F\">Read-only by default\n            <span style=\"width:32px;height:18px;border-radius:999px;background:#2C7A55;position:relative;display:inline-block\"><span style=\"position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff\"><\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;display:grid;grid-template-columns:1fr 350px;min-height:0\">\n          <div style=\"overflow-y:auto;padding:28px 32px 60px\">\n            <sc-for list=\"{{ toolGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"margin-bottom:34px\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296\">{{ g.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#9A948A\">{{ g.note }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px\">\n                  <sc-for list=\"{{ g.items }}\" as=\"t\" hint-placeholder-count=\"6\">\n                    <div style=\"border:1px solid {{ t.border }};background:#fff;border-radius:10px;padding:14px 15px;display:flex;flex-direction:column;gap:9px\">\n                      <div style=\"display:flex;align-items:center;gap:9px\">\n                        <span style=\"width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid #EAE6DE\"><span style=\"width:15px;height:15px;background-image:url({{ t.icon }});background-size:contain;background-repeat:no-repeat;background-position:center\"><\u002Fspan><\u002Fspan>\n                        <span style=\"font-size:13.5px;font-weight:500\">{{ t.name }}<\u002Fspan>\n                        <span style=\"margin-left:auto;width:6px;height:6px;border-radius:50%;background:{{ t.dot }}\"><\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8C877E;line-height:1.5;min-height:34px\">{{ t.reads }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:8px\">\n                        <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.04em;color:{{ t.stateFg }}\">{{ t.state }}<\u002Fspan>\n                        <button style=\"margin-left:auto;cursor:pointer;font-family:Geist,sans-serif;font-size:11.5px;padding:4px 10px;border-radius:6px;border:1px solid {{ t.btnBorder }};background:{{ t.btnBg }};color:{{ t.btnFg }};font-weight:500\">{{ t.btn }}<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border-left:1px solid #EDE9E1;background:#F9F7F4;overflow-y:auto;padding:26px 22px 50px\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#4A154B\">S<\u002Fspan>\n              <div>\n                <div style=\"font-size:13.5px;font-weight:550\">Slack<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8C877E\">Connected 4 months ago<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296;margin-top:26px\">What Kloyya can see<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:12px\">\n              <sc-for list=\"{{ slackPerms }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;background:#fff;border:1px solid #EFEBE3;border-radius:7px\">\n                  <span style=\"font-size:11px;color:{{ p.color }}\">{{ p.icon }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:#3F3C36\">{{ p.label }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-family:'Geist Mono',monospace;font-size:10.5px;color:#9A948A\">{{ p.meta }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A8A296;margin-top:26px\">Never<\u002Fdiv>\n            <div style=\"margin-top:12px;padding:13px;border:1px dashed #DDD8CE;border-radius:9px;font-size:12.5px;line-height:1.6;color:#57534C\">DMs, private channels you haven't shared, and anything in <span style=\"font-family:'Geist Mono',monospace;font-size:11.5px\">#exec-comp<\u002Fspan>. Kloyya never posts as you without an approval.<\u002Fdiv>\n            <button style=\"width:100%;margin-top:18px;cursor:pointer;font-family:Geist,sans-serif;background:#fff;border:1px solid #E3DED4;color:#A8412C;font-size:12.5px;font-weight:500;padding:9px;border-radius:7px\">Disconnect Slack<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signup&quot;,&quot;login&quot;,&quot;onboarding&quot;,&quot;compose&quot;,&quot;plan&quot;,&quot;run&quot;,&quot;detail&quot;,&quot;dashboard&quot;,&quot;integrations&quot;],&quot;default&quot;:&quot;signup&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;showLogoStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Landing page&quot;}}\">\nconst T = {\n  slack:{name:'Slack',letter:'S',color:'#4A154B',icon:'https:\u002F\u002Fwww.google.com\u002Fs2\u002Ffavicons?domain=slack.com&sz=64'},\n  gmail:{name:'Gmail',letter:'M',color:'#D93025',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fgmail'},\n  cal:{name:'Calendar',letter:'C',color:'#1A73E8',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fgooglecalendar'},\n  notion:{name:'Notion',letter:'N',color:'#181818',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fnotion'},\n  linear:{name:'Linear',letter:'L',color:'#5E6AD2',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Flinear'},\n  jira:{name:'Jira',letter:'J',color:'#0052CC',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fjira'},\n  github:{name:'GitHub',letter:'G',color:'#24292F',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fgithub'},\n  figma:{name:'Figma',letter:'F',color:'#D2451E',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Ffigma'},\n  sf:{name:'Salesforce',letter:'S',color:'#0B7FC0',icon:'https:\u002F\u002Fwww.google.com\u002Fs2\u002Ffavicons?domain=salesforce.com&sz=64'},\n  hub:{name:'HubSpot',letter:'H',color:'#E8622C',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fhubspot'},\n  drive:{name:'Drive',letter:'D',color:'#1E8E4E',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fgoogledrive'},\n  asana:{name:'Asana',letter:'A',color:'#D6555C',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fasana'},\n  wa:{name:'WhatsApp',letter:'W',color:'#1B9E52',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Fwhatsapp'},\n  ig:{name:'Instagram',letter:'I',color:'#C13584',icon:'https:\u002F\u002Fcdn.simpleicons.org\u002Finstagram'}\n};\nconst ORDER = ['slack','gmail','cal','notion','linear','jira','github','figma','sf','hub','drive','asana','wa','ig'];\n\nclass Component extends DCLogic {\n  state = { screen: this.props.startScreen || 'signup', faq: 0, chapter: 1, query: '', recording: false, recSecs: 0, menu: false,\n    onb: 0, persona: 'business', role: null, goal: null, picks: { gmail:true, wa:true, hub:true }, billing: 'monthly', plan: 'business' };\n  go(id) { return () => { this.setState({ screen: id }); window.scrollTo(0, 0); }; }\n  toggleFaq(i) { return () => this.setState(s => ({ faq: s.faq === i ? -1 : i })); }\n  pickChapter(i) { return () => this.setState({ chapter: i }); }\n\n  componentWillUnmount() { clearInterval(this._rec); }\n\n  pick = (key, val) => () => this.setState({ [key]: val });\n  togglePick = (k) => () => this.setState(s => {\n    const picks = Object.assign({}, s.picks);\n    if (picks[k]) { delete picks[k]; } else { picks[k] = true; }\n    return { picks };\n  });\n  step = (n) => () => { this.setState({ onb: n }); window.scrollTo(0, 0); };\n\n  setQuery = (e) => this.setState({ query: e.target.value });\n  fill = (text) => () => this.setState({ query: text, recording: false });\n  submit = () => { clearInterval(this._rec); this.setState({ recording: false, screen: 'plan' }); window.scrollTo(0, 0); };\n  onKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.submit(); } };\n\n  toggleRec = () => {\n    if (this.state.recording) { clearInterval(this._rec); this.setState({ recording: false }); return; }\n    const words = ['tell me ', 'which customers ', 'are about to ', 'churn ', 'and why'];\n    let i = 0;\n    this.setState({ recording: true, recSecs: 0, query: '' });\n    this._rec = setInterval(() => {\n      this.setState(s => {\n        const next = { recSecs: s.recSecs + 1 };\n        if (i < words.length) { next.query = s.query + words[i]; i++; }\n        return next;\n      });\n      if (i >= words.length + 2) { clearInterval(this._rec); this.setState({ recording: false }); }\n    }, 620);\n  };\n\n  renderVals() {\n    const s = this.state.screen;\n    const defs = [\n      ['signup','Sign up'],['login','Log in'],['onboarding','Onboarding'],['pricing','Choose plan'],['checkout','Checkout'],['welcome','Welcome'],['compose','New outcome'],\n      ['plan','Plan review'],['run','Live run'],['detail','Outcome delivered'],\n      ['dashboard','Outcomes'],['integrations','Connections']\n    ];\n    const switcher = defs.map(([id,label]) => ({\n      id, label, go: this.go(id),\n      bg: s === id ? '#2159C5' : 'transparent',\n      fg: s === id ? '#fff' : '#8B9099',\n      weight: s === id ? 550 : 450\n    }));\n\n    const navDefs = [\n      ['compose','New outcome','✧','',''],\n      ['dashboard','Outcomes','▤','12',''],\n      ['run','Runs','◷','1',''],\n      ['integrations','Connections','⬡','3','warn']\n    ];\n    const nav = navDefs.map((
